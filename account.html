<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your account — MoneyGuide</title>
  <script src="js/appearance.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/tools.css">
  <link rel="stylesheet" href="css/experience.css">
  <script src="js/i18n.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/cards.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/shell.js" defer></script>
  <script src="js/calculators.js" defer></script>
  <script src="js/tools.js" defer></script>
  <script src="js/account.js" defer></script>
</head>
<body data-page="account">
  <a class="skip-link" href="#account-main">Skip to content</a>
  <header id="site-header"></header>
  <main id="account-main" class="account-layout" tabindex="-1">
    <section class="account-story"><p class="eyebrow">MoneyGuide</p><h1 data-i18n="authHeading"></h1><p data-i18n="authIntro"></p><div class="account-story-art" aria-hidden="true"></div><a class="text-link" href="index.html" data-i18n="authHome"></a></section>
    <section class="account-card" aria-labelledby="account-title">
      <p class="eyebrow" data-i18n="authDemo"></p><h2 id="account-title"></h2>
      <p class="account-notice" data-i18n="authNotice"></p>
      <form id="account-form" novalidate>
        <label for="full-name" data-i18n="fullName"></label>
        <input id="full-name" name="fullName" autocomplete="username" maxlength="100" required aria-describedby="name-error">
        <p class="field-error" id="name-error"></p>
        <label for="account-password" data-i18n="authPassword"></label>
        <div class="password-field"><input id="account-password" name="password" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="password-help password-error"><button type="button" class="password-toggle" data-password-toggle="account-password" aria-pressed="false"></button></div>
        <p id="password-help" class="microcopy" data-i18n="authPasswordHelp"></p><p class="field-error" id="password-error"></p>
        <div id="confirm-group"><label for="confirm-password" data-i18n="authConfirm"></label><div class="password-field"><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" maxlength="128" required aria-describedby="confirm-error"><button type="button" class="password-toggle" data-password-toggle="confirm-password" aria-pressed="false"></button></div><p class="field-error" id="confirm-error"></p></div>
        <p id="account-error" class="error" role="alert"></p>
        <button id="account-submit" class="button full-width" type="submit"></button>
        <p id="account-success" class="account-success" role="status" tabindex="-1" hidden></p>
      </form>
      <p class="account-switch"><a id="account-switch" href="account.html?mode=login"></a></p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p>This browser-local demo requires JavaScript. No secure account service is connected.</p></noscript>
</body>
</html>
